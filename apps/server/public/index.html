<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Run Territory · Espectador</title>
<link rel="stylesheet" href="/vendor/maplibre/maplibre-gl.css" />
<style>
  :root { --bg:#0A0E17; --surface:#131A27; --border:#26314A; --text:#F2F5FA; --dim:#8C99B3; --accent:#7CFF4F; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--text); font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
  #map { position:absolute; inset:0; }
  .panel { position:absolute; top:16px; left:16px; width:280px; max-width:calc(100vw - 32px); background:#131A27EE; border:1px solid var(--border); border-radius:16px; padding:16px; }
  h1 { margin:0; font-size:20px; font-weight:900; letter-spacing:-0.5px; }
  h1 span { color:var(--accent); }
  .dim { color:var(--dim); font-size:12px; margin-top:4px; }
  ol { list-style:none; margin:12px 0 0; padding:0; }
  li { display:flex; align-items:center; gap:10px; padding:6px 0; border-top:1px solid var(--border); font-size:14px; }
  li b { flex:1; }
  .dot { width:12px; height:12px; border-radius:50%; border:2px solid #0006; }
  .num { font-variant-numeric: tabular-nums; color:var(--dim); }
</style>
</head>
<body>
<div id="map"></div>
<div class="panel">
  <h1>RUN <span>TERRITORY</span></h1>
  <div class="dim" id="summary">carregando…</div>
  <ol id="rank"></ol>
</div>
<script src="/vendor/maplibre/maplibre-gl.js"></script>
<script>
const STYLE_URL = 'https://tiles.openfreemap.org/styles/dark';
const FALLBACK = { version: 8, sources: {}, layers: [{ id: 'bg', type: 'background', paint: { 'background-color': '#0E1422' } }] };
const fmtArea = (m2) => m2 >= 1e6 ? (m2 / 1e6).toFixed(2).replace('.', ',') + ' km²' : Math.round(m2).toLocaleString('pt-BR') + ' m²';
let fitted = false;

async function pickStyle() {
  try { const r = await fetch(STYLE_URL, { signal: AbortSignal.timeout(4000) }); if (r.ok) return { style: await r.json(), labels: true }; } catch {}
  return { style: FALLBACK, labels: false };
}

(async () => {
  const { style, labels } = await pickStyle();
  const map = new maplibregl.Map({ container: 'map', style, center: [-46.6576, -23.5874], zoom: 14.5, attributionControl: { compact: true } });
  map.on('load', () => {
    const empty = { type: 'FeatureCollection', features: [] };
    map.addSource('territories', { type: 'geojson', data: empty });
    map.addSource('runners', { type: 'geojson', data: empty });
    map.addLayer({ id: 't-fill', type: 'fill', source: 'territories', paint: { 'fill-color': ['get', 'color'], 'fill-opacity': 0.4 } });
    map.addLayer({ id: 't-line', type: 'line', source: 'territories', paint: { 'line-color': ['get', 'color'], 'line-width': 2.5 } });
    map.addLayer({ id: 'r-trail', type: 'line', source: 'runners', filter: ['==', ['geometry-type'], 'LineString'], paint: { 'line-color': ['get', 'color'], 'line-width': 3, 'line-dasharray': [1.5, 1] } });
    map.addLayer({ id: 'r-dot', type: 'circle', source: 'runners', filter: ['==', ['geometry-type'], 'Point'], paint: { 'circle-radius': 7, 'circle-color': ['get', 'color'], 'circle-stroke-color': '#fff', 'circle-stroke-width': 2 } });
    if (labels) map.addLayer({ id: 't-label', type: 'symbol', source: 'territories', layout: { 'text-field': ['get', 'username'], 'text-size': 13, 'text-font': ['Noto Sans Bold'] }, paint: { 'text-color': '#fff', 'text-halo-color': '#000', 'text-halo-width': 1.5 } });
    refresh();
    setInterval(refresh, 3000);
  });

  async function refresh() {
    const data = await fetch('/api/public/map').then((r) => r.json());
    map.getSource('territories').setData(data.territories);
    map.getSource('runners').setData({
      type: 'FeatureCollection',
      features: data.live.flatMap((r) => [
        { type: 'Feature', properties: { color: r.color }, geometry: { type: 'Point', coordinates: [r.lng, r.lat] } },
        ...(r.trail.length > 1 ? [{ type: 'Feature', properties: { color: r.color }, geometry: { type: 'LineString', coordinates: r.trail } }] : []),
      ]),
    });
    const feats = data.territories.features.sort((a, b) => b.properties.areaM2 - a.properties.areaM2);
    document.getElementById('summary').textContent = `${feats.length} jogadores com território · ${data.live.length} correndo agora`;
    document.getElementById('rank').innerHTML = feats.slice(0, 10).map((f, i) =>
      `<li><span class="num">${i + 1}</span><span class="dot" style="background:${f.properties.color}"></span><b>${f.properties.username}</b><span class="num">${fmtArea(f.properties.areaM2)}</span></li>`).join('');
    if (!fitted && feats.length) {
      fitted = true;
      const b = new maplibregl.LngLatBounds();
      for (const f of feats) for (const poly of f.geometry.coordinates) for (const c of poly[0]) b.extend(c);
      map.fitBounds(b, { padding: { top: 40, bottom: 40, left: 320, right: 40 }, duration: 0 });
    }
  }
})();
</script>
</body>
</html>
