services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: runterritory
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      retries: 20
  server:
    build: .
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/runterritory
      PORT: 3000
    ports: ["3000:3000"]
    depends_on:
      db: { condition: service_healthy }
volumes:
  pgdata:
